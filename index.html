<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Valentine Surprise ❤️</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: system-ui, Arial;
  background: linear-gradient(135deg,#ffd6e8,#fff0f6);
}

/* floating hearts background */
body::before{
  content:"❤️ 💖 💕 💗 💓 💘 ❤️ 💖 💕";
  position:fixed;
  font-size:32px;
  opacity:.08;
  animation: float 20s linear infinite;
  white-space:nowrap;
  top:100%;
  left:0;
}
@keyframes float{
  from{ transform: translateY(0); }
  to{ transform: translateY(-120vh); }
}

.card{
  background:white;
  padding:34px 22px 26px;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.12);
  text-align:center;
  width:min(520px,92vw);
}

h1{
  font-size:22px;
  margin-bottom:18px;
}

.topIcon{
  font-size:56px;
  margin-bottom:8px;
  animation: pulse 1.6s infinite;
}

@keyframes pulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.2); }
}

.playground{
  height:180px;
  position:relative;
  border-radius:16px;
  background:#fff6fb;
}

button{
  position:absolute;
  border:none;
  border-radius:40px;
  padding:14px 28px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

#yes{
  background:#ff3b7a;
  color:white;
  left:60%;
  top:65%;
  transform:translate(-50%,-50%) scale(1);
}

#no{
  background:#eee;
  left:30%;
  top:65%;
  transform:translate(-50%,-50%);
}

.success{
  display:none;
  margin-top:18px;
}

.yayIcon{
  font-size:80px;
  margin-bottom:10px;
  animation: pulse 1.2s infinite;
}

.success h2{
  font-size:26px;
  margin:0;
}
</style>
</head>

<body>

<div class="card">

  <div class="topIcon">💌</div>

  <h1 id="question"></h1>

  <div class="playground" id="area">
    <button id="no">No</button>
    <button id="yes">Yes</button>
  </div>

  <div class="success" id="success">
      <div class="yayIcon">💖</div>
      <h2>YAY! It's a date! 🎉</h2>
  </div>

</div>

<script>
const names=["Alex","Jamie","Taylor","Jordan","Riley","Sam","Avery","Casey","Morgan"];
const randomName=names[Math.floor(Math.random()*names.length)];
document.getElementById("question").innerText=`${randomName}, will you be my valentine?`;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const area=document.getElementById("area");
const success=document.getElementById("success");

let scale=1;

function moveNo(){
  const w=area.clientWidth-noBtn.offsetWidth;
  const h=area.clientHeight-noBtn.offsetHeight;

  noBtn.style.left=Math.random()*w+"px";
  noBtn.style.top=Math.random()*h+"px";

  scale+=0.15;
  yesBtn.style.transform=`translate(-50%,-50%) scale(${scale})`;
}

noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",e=>{e.preventDefault();moveNo();},{passive:false});

yesBtn.addEventListener("click",()=>{
  area.style.display="none";
  success.style.display="block";
});
</script>

</body>
</html>
